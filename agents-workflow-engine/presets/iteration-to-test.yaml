id: iteration-to-test
entry: graph-start
lanes:
  - { id: human, title: 人 }
  - { id: master, title: graph-master }
  - { id: subagent, title: 子 agent }
models:
  # 两个模型就够：执行者干所有 action，门禁做所有 gate 的判定。
  # 环境变量有值时优先，CI 换模型不用改这个文件。
  executor: { model: DeepSeek-V4.1-Flash-1017, env: MODEL_EXECUTOR }
  gate: { model: GLM-5.3-Flash, env: MODEL_GATE }
loops:
  - id: spec
    maxIterations: 3
    backEdges: [req-gate-reject, req-decision-reject]
  - id: hld
    maxIterations: 3
    backEdges: [hld-reject]
  - id: dev
    maxIterations: 3
    backEdges: [build-reject, e2e-reject]
  - id: e2e
    maxIterations: 3
    backEdges: [e2e-revise]
nodes:
  - { id: graph-start, actor: master, kind: entry, title: 会话启动 }
  - { id: start-version, actor: human, kind: human_input, title: 开始版本 }
  - { id: pm-start-iteration, actor: subagent, kind: action, skill: pm-start-iteration, title: 开始迭代 }
  - { id: write-spec, actor: human, kind: human_input, title: 编写规格 }
  - { id: ba-write-spec, actor: subagent, kind: action, skill: ba-write-spec, title: 需求规格 }
  - { id: ba-write-prototype, actor: subagent, kind: action, skill: ba-write-prototype, title: 原型, once: true }
  - { id: ba-requirement-review, actor: subagent, kind: gate, skill: ba-requirement-review, title: 需求质量门 }
  - { id: requirement-decision, actor: human, kind: decision, title: 需求决策, options: [满意, 不满意] }
  - { id: qa-write-cases, actor: subagent, kind: action, skill: qa-write-cases, title: 编写 QA 用例 }
  - { id: tech-brief, actor: human, kind: human_input, title: 技术高阶 }
  - { id: tl-high-level-design, actor: subagent, kind: action, skill: tl-high-level-design, title: 技术高阶设计, once: true }
  - { id: hld-decision, actor: human, kind: decision, title: 高阶决策, options: [满意, 不满意] }
  - id: dev-plan
    actor: subagent
    kind: action
    skill: dev-plan
    title: 详细规划
    batch: true
    note: [详细设计（API/DB 字段、文件改动）, 任务清单, 自测用例（DST）]
  - { id: dev-plan-review, actor: subagent, kind: gate, skill: dev-plan-review, title: plan 质量门 }
  - { id: plan-confirm, actor: human, kind: human_input, title: plan 确认 }
  - { id: plan-decision, actor: human, kind: decision, title: plan 决策, options: [满意, 不满意] }
  - { id: overnight-runner, actor: subagent, kind: action, skill: overnight-runner, title: 排本批顺序 }
  - id: dev-build
    actor: subagent
    kind: action
    skill: dev-build
    title: 构建与自测
    sealed: true
    repeatsBatch: dev-plan
    note: [后端 TDD, 前端 TDD, 构建/Lint, 前端 UI review, API 测试, 浏览器自测]
  - { id: build-decision, actor: human, kind: decision, title: 构建决策, options: [满意, 不满意] }
  - { id: amend-input, actor: human, kind: human_input, title: 修订输入 }
  - { id: dev-plan-amend, actor: subagent, kind: action, skill: dev-plan-amend, title: 规划修订 }
  - { id: handoff, actor: master, kind: milestone, title: 提测 }
  - { id: qa-run-e2e, actor: subagent, kind: action, skill: qa-run-e2e, title: 编写并运行 E2E 测试, join: true }
  - { id: test-decision, actor: human, kind: decision, title: 测试决策, options: [修订, 通过, 打回开发] }
  - { id: accepted, actor: master, kind: milestone, title: 人工补测 }
  - { id: ba-gen-facts, actor: subagent, kind: action, skill: ba-gen-facts, title: 刷新事实文档 }
  - { id: dev-release-plan, actor: subagent, kind: action, skill: dev-release-plan, title: 准备上线 }
  - { id: shipped, actor: master, kind: end, title: 可上线 }
edges:
  - { id: e0, from: graph-start, to: start-version }
  - { id: e1, from: start-version, to: pm-start-iteration }
  - { id: e2, from: pm-start-iteration, to: write-spec }
  - { id: e3, from: write-spec, to: ba-write-spec }
  - { id: e4, from: ba-write-spec, to: ba-write-prototype }
  - { id: e5, from: ba-write-spec, to: ba-requirement-review }
  - { id: e6, from: ba-write-prototype, to: ba-requirement-review }
  - { id: req-pass, from: ba-requirement-review, to: requirement-decision, when: 满意 }
  - { id: req-gate-reject, from: ba-requirement-review, to: write-spec, when: 不满意, back: true }
  - { id: req-decision-reject, from: requirement-decision, to: write-spec, when: 不满意, back: true }
  - { id: req-qa, from: requirement-decision, to: qa-write-cases, when: 满意, parallel: true }
  - { id: req-ok, from: requirement-decision, to: tech-brief, when: 满意 }
  - { id: e7, from: tech-brief, to: tl-high-level-design }
  - { id: e8, from: tl-high-level-design, to: hld-decision }
  - { id: hld-reject, from: hld-decision, to: tech-brief, when: 不满意, back: true }
  - { id: hld-ok, from: hld-decision, to: dev-plan, when: 满意 }
  - { id: e9, from: dev-plan, to: dev-plan-review }
  - { id: plan-pass, from: dev-plan-review, to: plan-confirm, when: 满意 }
  - { id: e10, from: plan-confirm, to: plan-decision }
  - { id: plan-ok, from: plan-decision, to: overnight-runner, when: 满意 }
  - { id: e11, from: overnight-runner, to: dev-build }
  - { id: e12, from: dev-build, to: build-decision }
  - { id: build-pass, from: build-decision, to: handoff, when: 满意 }
  - { id: build-reject, from: build-decision, to: amend-input, when: 不满意, back: true }
  - { id: e13, from: amend-input, to: dev-plan-amend }
  - { id: e14, from: dev-plan-amend, to: dev-plan, back: true }
  - { id: handoff-to-e2e, from: handoff, to: qa-run-e2e }
  - { id: qa-cases-ready, from: qa-write-cases, to: qa-run-e2e }
  - { id: e2e-to-decision, from: qa-run-e2e, to: test-decision }
  - { id: e2e-revise, from: test-decision, to: qa-run-e2e, when: 修订, back: true }
  - { id: e2e-pass, from: test-decision, to: accepted, when: 通过 }
  - { id: e2e-reject, from: test-decision, to: amend-input, when: 打回开发, back: true }
  - { id: accepted-to-facts, from: accepted, to: ba-gen-facts }
  - { id: facts-to-release, from: ba-gen-facts, to: dev-release-plan }
  - { id: release-to-shipped, from: dev-release-plan, to: shipped }
