<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>① 初始化 · AI-Native 全流程</title>
<style>
  :root {
    --bg: #fafaf7; --ink: #23251f; --muted: #6d6f68; --hair: #e4e2da; --card-line: #d8d6cc;
    --card: #ffffff;
    --gold: #a5770e; --gold-soft: #fdf6e3;
    --green: #2e6e4c; --green-soft: #eef5f0;
    --danger: #a84a34;
    --master: #f2f1ec; --pill: #f3f2ec;
    --edge: #8b8d84;
    --lane: #f6f5f1; --lane-bar: #efeee8;
    --input: #edf3f9; --input-line: #c8d6e4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { position: relative; padding: 16px 26px 0; }
  h1 { margin: 0 0 4px; font-size: 17px; font-weight: 650; letter-spacing: 0.2px; }
  .sub { margin: 0; color: var(--muted); font-size: 12.5px; }
  nav { position: absolute; top: 18px; right: 26px; display: flex; gap: 2px; margin: 0;
    padding: 3px; background: var(--pill); border-radius: 999px; font-size: 12.5px; }
  nav a { color: var(--muted); text-decoration: none; padding: 5px 14px; border-radius: 999px; }
  nav a.cur { color: #fff; background: var(--ink); font-weight: 600; }
  nav a:not(.cur):hover { color: var(--ink); background: var(--hair); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center;
    margin: 9px 0 0; color: var(--muted); font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 18px; height: 12px; border: 1px solid var(--card-line); border-radius: 4px; background: var(--card); }
  .sw.input { background: var(--input); border-color: var(--input-line); transform: skewX(-16deg); }
  .sw.decision { width: 11px; height: 11px; background: var(--gold-soft); border-color: var(--gold); transform: rotate(45deg); }
  .sw.gate { position: relative; border-radius: 2px; border-color: var(--ink); }
  .sw.gate::after { content: ""; position: absolute; inset: 3px; border: 1px solid var(--ink); }
  .sw.line { width: 24px; height: 0; border: none; border-top: 1.6px solid var(--edge); border-radius: 0; background: none; }
  .sw.line.dashed { border-top-color: var(--danger); border-top-style: dashed; }
  .star { color: var(--gold); font-weight: 700; }
  .hotl { color: var(--green); font-weight: 700; }
  .wrap { padding: 8px 22px 14px; }
  svg { width: 100%; height: auto; display: block; }
  svg text { font-family: inherit; }
  .tt  { font-size: 14px; font-weight: 650; fill: var(--ink); }
  .tm  { font-size: 12.5px; font-weight: 600; fill: var(--ink); }
  .t   { font-size: 12px; fill: var(--ink); }
  .ts  { font-size: 11px; fill: var(--muted); }
  .tc  { font-size: 10px; fill: var(--muted); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .gd  { font-size: 12px; font-weight: 600; fill: var(--gold); }
  .gds { font-size: 11px; font-weight: 600; fill: var(--gold); }
  .ht  { font-size: 11px; font-weight: 600; fill: var(--green); }
  .rd  { font-size: 11px; fill: var(--danger); }
  .lane-label { font-size: 11.5px; font-weight: 650; fill: var(--muted); letter-spacing: 0.5px; }
  .n-card { fill: var(--card); stroke: var(--card-line); stroke-width: 1; }
  .n-action { fill: var(--green-soft); stroke: #cfdccf; stroke-width: 1; }
  .n-input { fill: var(--input); stroke: var(--input-line); stroke-width: 1; }
  .n-decision { fill: var(--gold-soft); stroke: var(--gold); stroke-width: 1.2; }
  .n-gate { fill: var(--card); stroke: var(--ink); stroke-width: 1; }
  .n-end { fill: var(--card); stroke: var(--card-line); stroke-width: 1; }
  .n-pill { fill: var(--pill); }
  .lift { filter: url(#soft); }
  .edge { stroke: var(--edge); stroke-width: 1.4; fill: none; stroke-linejoin: round; stroke-linecap: round; marker-end: url(#arr); }
  .edge-red { stroke: var(--danger); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; stroke-linejoin: round; marker-end: url(#arrR); }
  a:hover .n-card, a:hover .n-action, a:hover .n-end { filter: brightness(0.97); }
</style>
</head>
<body>
<header>
  <h1>① 初始化 —— 从原始需求到冻结基线（一次性，只跑一次）</h1>
  <p class="sub">输入两份资产：业务原始需求 + 研发通用知识资产；九件产出由 AI 生成（◎），分三批呈报，三批人工确认（★）都通过才冻结</p>
  <nav>
    <a href="overview.html">总览</a>
    <a class="cur" href="init.html">① 初始化</a>
    <a href="requirement.html">② 需求分析</a>
    <a href="delivery.html">③ 开发 · 测试</a>
    <a href="knowledge.html">④ 知识回流</a>
  </nav>
  <p class="legend">
    <span><i class="sw input"></i>输入资产</span>
    <span class="hotl">◎ HOTL · AI 执行</span>
    <span><i class="sw decision"></i>★ HITL · 人决策</span>
    <span><i class="sw gate"></i>机器门禁</span>
    <span><i class="sw line"></i>正向流转</span>
    <span><i class="sw line dashed"></i>打回 · 返工</span>
  </p>
</header>
<div class="wrap">

  <!-- 泳道（统一中性色） -->

  <rect x="0" y="194" width="110" height="240" fill="var(--lane-bar)"/>
  <text class="lane-label" x="55" y="306" text-anchor="middle">po</text>

  <rect x="0" y="434" width="1600" height="170" fill="var(--lane)" stroke="var(--hair)"/>
  <rect x="0" y="434" width="110" height="170" fill="var(--lane-bar)"/>
  <text class="lane-label" x="55" y="512" text-anchor="middle">tl</text>
  <text class="ts" x="55" y="530" text-anchor="middle">架构 · 护送</text>

  <!-- 本页自主度徽章 -->
  <text class="gds" x="1556" y="64" text-anchor="end">本页自主度：★ 3 处人工确认 ｜ ◎ 九件产出全部由 AI 生成</text>

  <!-- 输入资产 -->
  <polygon class="n-input" points="150,250 280,250 260,350 130,350"/>

  <text class="ts" x="205" y="514" text-anchor="middle">技术规范 × 5 · 前端约束</text>

  <!-- po 泳道：通读 → 研究 → ①~⑤ -->
  <rect class="n-card lift" x="310" y="250" width="140" height="100" rx="12"/>
  <text class="tm" x="380" y="292" text-anchor="middle">先通读</text>
  <text class="tm" x="380" y="310" text-anchor="middle">原始需求</text>
  <text class="ts" x="380" y="332" text-anchor="middle">不是只看摘要</text>

  <rect class="n-action lift" x="480" y="245" width="180" height="110" rx="12"/>

  <text class="ts" x="570" y="304" text-anchor="middle">行业机制 · 流程 · 趋势</text>
  <text class="ts" x="570" y="322" text-anchor="middle">竞品 · 企业自身 · 机会</text>
  <text class="ts" x="570" y="340" text-anchor="middle">证据台账 + 最大未知</text>
  <text class="ht" x="652" y="260" text-anchor="end">◎</text>
  <rect class="n-pill" x="498" y="364" width="144" height="18" rx="9"/>
  <text class="tc" x="506" y="377">po-domain-research</text>

  <!-- ①~⑤ 五件套 -->
  <g>
    <rect class="n-card lift" x="690" y="245" width="125" height="110" rx="12"/>

    <text class="ts" x="752" y="300" text-anchor="middle">定位 · 理念</text>
    <text class="ts" x="752" y="318" text-anchor="middle">范围 · 决策准则</text>

    <rect class="n-card lift" x="845" y="245" width="125" height="110" rx="12"/>

    <text class="ts" x="907" y="300" text-anchor="middle">L1 / L2 / L3</text>
    <text class="ts" x="907" y="318" text-anchor="middle">高层 To-Be</text>
    <text class="ht" x="962" y="260" text-anchor="end">◎</text>

    <rect class="n-card lift" x="1000" y="245" width="125" height="110" rx="12"/>
    <text class="tm" x="1062" y="272" text-anchor="middle">③ 领域模型</text>
    <text class="tm" x="1062" y="290" text-anchor="middle">+ 服务蓝图</text>
    <text class="ts" x="1062" y="312" text-anchor="middle">BC · CAP · SB</text>
    <text class="ts" x="1062" y="330" text-anchor="middle">硬规矩挂聚合</text>
    <text class="ht" x="1117" y="260" text-anchor="end">◎</text>

    <rect class="n-card lift" x="1155" y="245" width="125" height="110" rx="12"/>
    <text class="tm" x="1217" y="278" text-anchor="middle">④ 统一语言</text>
    <text class="ts" x="1217" y="300" text-anchor="middle">主词 + 弃用叫法</text>
    <text class="ts" x="1217" y="318" text-anchor="middle">状态 · 角色口径</text>
    <text class="ht" x="1272" y="260" text-anchor="end">◎</text>

    <rect class="n-card lift" x="1310" y="245" width="130" height="110" rx="12"/>
    <text class="tm" x="1375" y="278" text-anchor="middle">⑤ 设计系统</text>
    <text class="ts" x="1375" y="300" text-anchor="middle">三层令牌 → 组件</text>
    <text class="ts" x="1375" y="318" text-anchor="middle">状态 ↔ 视觉语义</text>
    <text class="ht" x="1432" y="260" text-anchor="end">◎</text>
  </g>
  <rect class="n-pill" x="1000" y="364" width="170" height="18" rx="9"/>
  <text class="tc" x="1008" y="377">po-prod-init · 五件套</text>

  <!-- tl 泳道：⑥⑦⑧ + 冻结 -->
  <rect class="n-card lift" x="650" y="465" width="175" height="110" rx="12"/>
  <text class="tm" x="737" y="498" text-anchor="middle">⑥ 架构设计</text>
  <text class="ts" x="737" y="520" text-anchor="middle">分层架构 + 决策记录</text>
  <text class="ts" x="737" y="538" text-anchor="middle">引用规范编号，不复述</text>
  <text class="ht" x="817" y="480" text-anchor="end">◎</text>
  <rect class="n-pill" x="693" y="584" width="88" height="18" rx="9"/>
  <text class="tc" x="701" y="597">tl-arch-plan</text>

  <rect class="n-card lift" x="850" y="465" width="175" height="110" rx="12"/>
  <text class="tm" x="937" y="498" text-anchor="middle">⑦ 活基线种子</text>
  <text class="ts" x="937" y="520" text-anchor="middle">数据模型 TBL-*</text>
  <text class="ts" x="937" y="538" text-anchor="middle">接口目录 API-*</text>
  <text class="ht" x="1017" y="480" text-anchor="end">◎</text>

  <rect class="n-card lift" x="1060" y="465" width="165" height="110" rx="12"/>
  <text class="tm" x="1142" y="498" text-anchor="middle">⑧ 版本路线图</text>
  <text class="ts" x="1142" y="520" text-anchor="middle">业务结果 → Epic → 版本</text>
  <text class="ts" x="1142" y="538" text-anchor="middle">每版一条端到端旅程</text>
  <text class="ht" x="1217" y="480" text-anchor="end">◎</text>
  <rect class="n-pill" x="1081" y="584" width="122" height="18" rx="9"/>
  <text class="tc" x="1089" y="597">tl-roadmap-plan</text>

  <rect x="1276" y="471" width="148" height="98" fill="none" stroke="var(--ink)" stroke-width="0.8"/>
  <text class="tm" x="1350" y="508" text-anchor="middle">冻结基线</text>
  <text class="ts" x="1350" y="530" text-anchor="middle">状态行改写</text>
  <text class="ts" x="1350" y="548" text-anchor="middle">机器可校验</text>

  <!-- 出口 -->
  <a href="requirement.html">
    <ellipse class="n-end lift" cx="1520" cy="520" rx="72" ry="32"/>
    <text class="tm" x="1520" y="516" text-anchor="middle">进入 ②</text>
    <text class="ts" x="1520" y="534" text-anchor="middle">版本迭代循环</text>
  </a>

  <!-- 三个人工决策点（菱形） -->
  <g>
    <polygon class="n-decision lift" points="570,126 655,158 570,190 485,158"/>
    <text class="gd" x="570" y="154" text-anchor="middle">★ HITL-0</text>
    <text class="ts" x="570" y="172" text-anchor="middle">研究确认</text>

    <polygon class="n-decision lift" points="1375,126 1465,158 1375,190 1285,158"/>

    <text class="ts" x="1375" y="172" text-anchor="middle">业务认知确认</text>

    <polygon class="n-decision lift" points="1142,126 1227,158 1142,190 1057,158"/>
    <text class="gd" x="1142" y="154" text-anchor="middle">★ HITL-2</text>
    <text class="ts" x="1142" y="172" text-anchor="middle">方案与排期确认</text>
  </g>

  <!-- 机器门禁：入口输入齐 / 出口冻结校验 -->
  <rect class="n-gate" x="287" y="292" width="16" height="16" rx="2"/>
  <rect x="291" y="296" width="8" height="8" fill="none" stroke="var(--ink)" stroke-width="1"/>
  <text class="tc" x="295" y="326" text-anchor="middle">输入齐</text>

  <!-- 打回（红虚线）：落点一律是本批第一件，不跨批、不跳件；
       上层泳道的打回走卡片上方的上走廊，下层泳道的打回走卡片下方 / 下沿，避免与正向箭头缠在一起 -->
  <!-- HITL-0 不过 → ⓪ 领域深度研究（本批仅此一件） -->
  <path class="edge-red" d="M620 171 V245"/>
  <text class="rd" x="632" y="216">不过 → 补研究再报</text>
  <!-- HITL-1 不过 → ① 产品定位（①~⑤ 五件套整批重来） -->
  <path class="edge-red" d="M1375 126 V92 H790 V245"/>
  <text class="rd" x="1010" y="84" text-anchor="middle">HITL-1 不过 → 五件套整批改完再报</text>
  <!-- HITL-2 不过 → ⑥ 架构设计（⑥⑦⑧ 整批重来）：降到 po 卡片下沿再左行，不穿卡片 -->
  <path class="edge-red" d="M1057 158 H980 V390 H675 V465"/>
  <text class="rd" x="990" y="232">HITL-2 不过 → 改制品重报</text>

  <!-- 底部铁律 -->
  <text class="t" x="140" y="648">铁律：三批人工确认都必须停，不许自动冻结、不许跳批；锚点一经发布不改名，重跑只增量合并。</text>
  <text class="ts" x="140" y="672">冻结不是口头状态 —— 基线未冻结时，机器门禁直接拦截需求侧命令，流程当场起不来，而不是跑完才发现。</text>
  <text class="ts" x="140" y="694">打回只有一个落点：回到本批第一件（HITL-0→⓪ / HITL-1→① / HITL-2→⑥），只回本批，不跨批、不跳件。</text>
</svg>
</div>
</body>
