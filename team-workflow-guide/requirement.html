<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>② 需求分析 · AI-Native 全流程</title>
<style>
  :root {
    --bg: #fafaf7; --ink: #23251f; --muted: #6d6f68; --hair: #e4e2da; --card-line: #d8d6cc;
    --card: #ffffff;
    --gold: #a5770e; --gold-soft: #fdf6e3;
    --green: #2e6e4c; --green-soft: #eef5f0;
    --danger: #a84a34;
    --master: #f2f1ec; --pill: #f3f2ec;
    --edge: #8b8d84;
    --lane: #f6f5f1; --lane-bar: #efeee8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { position: relative; padding: 16px 26px 0; }
  h1 { margin: 0 0 4px; font-size: 17px; font-weight: 650; letter-spacing: 0.2px; }
  .sub { margin: 0; color: var(--muted); font-size: 12.5px; }
  nav { position: absolute; top: 18px; right: 26px; display: flex; gap: 2px; margin: 0;
    padding: 3px; background: var(--pill); border-radius: 999px; font-size: 12.5px; }
  nav a { color: var(--muted); text-decoration: none; padding: 5px 14px; border-radius: 999px; }
  nav a.cur { color: #fff; background: var(--ink); font-weight: 600; }
  nav a:not(.cur):hover { color: var(--ink); background: var(--hair); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center;
    margin: 9px 0 0; color: var(--muted); font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 18px; height: 12px; border: 1px solid var(--card-line); border-radius: 4px; background: var(--card); }
  .sw.decision { width: 11px; height: 11px; background: var(--gold-soft); border-color: var(--gold); transform: rotate(45deg); }
  .sw.gate { position: relative; border-radius: 2px; border-color: var(--ink); }
  .sw.gate::after { content: ""; position: absolute; inset: 3px; border: 1px solid var(--ink); }
  .sw.line { width: 24px; height: 0; border: none; border-top: 1.6px solid var(--edge); border-radius: 0; background: none; }
  .sw.line.dashed { border-top-color: var(--danger); border-top-style: dashed; }
  .star { color: var(--gold); font-weight: 700; }
  .hotl { color: var(--green); font-weight: 700; }
  .wrap { padding: 8px 22px 14px; }
  svg { width: 100%; height: auto; display: block; }
  svg text { font-family: inherit; }
  .tt  { font-size: 14px; font-weight: 650; fill: var(--ink); }
  .tm  { font-size: 12.5px; font-weight: 600; fill: var(--ink); }
  .t   { font-size: 12px; fill: var(--ink); }
  .ts  { font-size: 11px; fill: var(--muted); }
  .tc  { font-size: 10px; fill: var(--muted); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .gd  { font-size: 12px; font-weight: 600; fill: var(--gold); }
  .gds { font-size: 11px; font-weight: 600; fill: var(--gold); }
  .ht  { font-size: 11px; font-weight: 600; fill: var(--green); }
  .rd  { font-size: 11px; fill: var(--danger); }
  .lane-label { font-size: 11.5px; font-weight: 650; fill: var(--muted); letter-spacing: 0.5px; }
  .n-card { fill: var(--card); stroke: var(--card-line); stroke-width: 1; }
  .n-action { fill: var(--green-soft); stroke: #cfdccf; stroke-width: 1; }
  .n-decision { fill: var(--gold-soft); stroke: var(--gold); stroke-width: 1.2; }
  .n-gate { fill: var(--card); stroke: var(--ink); stroke-width: 1; }
  .n-end { fill: var(--card); stroke: var(--card-line); stroke-width: 1; }
  .n-pill { fill: var(--pill); }
  .lift { filter: url(#soft); }
  .edge { stroke: var(--edge); stroke-width: 1.4; fill: none; stroke-linejoin: round; stroke-linecap: round; marker-end: url(#arr); }
  .edge-red { stroke: var(--danger); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; stroke-linejoin: round; marker-end: url(#arrR); }
  a:hover .n-card, a:hover .n-action, a:hover .n-end { filter: brightness(0.97); }
</style>
</head>
<body>
<header>
  <h1>② 需求分析 —— Epic 批循环（L3 主线 + 每个环节的 L4 自闭环）</h1>
  <p class="sub">整批 Story 放在一起评审才判得出冲突；只有两个业务门 ★E1 / ★E2，其余环节 AI 带收敛判据自闭环（◎）</p>
  <nav>
    <a href="overview.html">总览</a>
    <a href="init.html">① 初始化</a>
    <a class="cur" href="requirement.html">② 需求分析</a>
    <a href="delivery.html">③ 开发 · 测试</a>
    <a href="knowledge.html">④ 知识回流</a>
  </nav>
  <p class="legend">
    <span class="hotl">◎ HOTL · AI 执行</span>
    <span><i class="sw decision"></i>★ HITL · 人决策</span>
    <span><i class="sw gate"></i>质量闸门</span>
    <span><i class="sw line"></i>正向流转</span>
    <span><i class="sw line dashed"></i>打回 · 回炉</span>
  </p>
</header>
<div class="wrap">
<svg viewBox="0 30 1600 800" role="img" aria-label="需求分析循环">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#23251f" flood-opacity="0.09"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b8d84"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a84a34"/>
    </marker>
  </defs>

  <!-- 泳道 -->
  <rect x="0" y="110" width="1600" height="84" fill="var(--lane)" stroke="var(--hair)"/>
  <rect x="0" y="110" width="110" height="84" fill="var(--lane-bar)"/>
  <text class="lane-label" x="55" y="146" text-anchor="middle">业务方</text>
  <text class="ts" x="55" y="164" text-anchor="middle">决策</text>

  <rect x="0" y="194" width="1600" height="290" fill="var(--lane)" stroke="var(--hair)"/>
  <rect x="0" y="194" width="110" height="290" fill="var(--lane-bar)"/>
  <text class="lane-label" x="55" y="332" text-anchor="middle">po</text>

  <rect x="0" y="484" width="1600" height="150" fill="var(--lane)" stroke="var(--hair)"/>
  <rect x="0" y="484" width="110" height="150" fill="var(--lane-bar)"/>
  <text class="lane-label" x="55" y="552" text-anchor="middle">qa</text>
  <text class="ts" x="55" y="570" text-anchor="middle">对抗审查</text>

  <!-- 本页自主度徽章 -->
  <text class="gds" x="1556" y="64" text-anchor="end">本页自主度：★ 2（E1 / E2）｜ ◎ 七个环节 AI 自闭环</text>

  <!-- 需求调研 -->
  <rect class="n-card lift" x="140" y="250" width="150" height="100" rx="12"/>
  <text class="tm" x="215" y="284" text-anchor="middle">需求调研</text>
  <text class="ts" x="215" y="306" text-anchor="middle">只收集 · 不转化</text>
  <text class="ts" x="215" y="326" text-anchor="middle">疑问汇总到探索</text>
  <text class="ht" x="282" y="264" text-anchor="end">◎</text>
  <rect class="n-pill" x="163" y="360" width="104" height="18" rx="9"/>
  <text class="tc" x="171" y="373">po-req-research</text>

  <!-- 探索（四件套） -->
  <rect class="n-action lift" x="330" y="230" width="250" height="160" rx="12"/>
  <text class="tm" x="455" y="258" text-anchor="middle">探索（方案设计）</text>
  <text class="ht" x="455" y="278" text-anchor="middle">◎ AI 执行 · 产出四件套</text>
  <text class="t" x="350" y="304">· 典型场景 + 简洁旅程</text>
  <text class="t" x="350" y="326">· 任务流程图（L4 / L5）</text>
  <text class="t" x="350" y="348">· 业务规则与表单</text>
  <text class="t" x="350" y="370">· 待业务确认清单</text>
  <text class="ts" x="350" y="388">汇总成一张四 Tab 视图给业务看</text>
  <rect class="n-pill" x="338" y="398" width="104" height="18" rx="9"/>
  <text class="tc" x="346" y="411">po-req-explore</text>

  <!-- 原型 -->
  <rect class="n-action lift" x="700" y="230" width="230" height="160" rx="12"/>
  <text class="tm" x="815" y="258" text-anchor="middle">原型（UI · 两步走）</text>
  <text class="ht" x="815" y="278" text-anchor="middle">◎ AI 执行 · 只消费设计系统令牌</text>
  <text class="t" x="720" y="304">第一步：分场景走查稿</text>
  <text class="t" x="720" y="326">第二步：定稿 living 原型</text>
  <text class="t" x="720" y="348">冻结本 Epic 快照</text>
  <text class="ts" x="720" y="376">走查稿是交互步骤的事实来源</text>
  <rect class="n-pill" x="700" y="398" width="112" height="18" rx="9"/>
  <text class="tc" x="708" y="411">po-req-prototype</text>

  <!-- 需求拆分 -->
  <rect class="n-card lift" x="980" y="250" width="170" height="100" rx="12"/>
  <text class="tm" x="1065" y="282" text-anchor="middle">需求拆分</text>
  <text class="ts" x="1065" y="304" text-anchor="middle">覆盖对账 · 步骤分配</text>
  <text class="ts" x="1065" y="324" text-anchor="middle">承诺项 ≥ 1 个 Story</text>
  <text class="ht" x="1142" y="264" text-anchor="end">◎</text>
  <rect class="n-pill" x="1012" y="360" width="106" height="18" rx="9"/>
  <text class="tc" x="1020" y="373">po-req-storymap</text>

  <!-- Story × N（队列感） -->
  <rect x="1208" y="242" width="170" height="100" rx="12" fill="none" stroke="var(--card-line)" stroke-dasharray="4 4"/>
  <rect x="1204" y="246" width="170" height="100" rx="12" fill="none" stroke="var(--card-line)" stroke-dasharray="4 4"/>
  <rect class="n-card lift" x="1200" y="250" width="170" height="100" rx="12"/>
  <text class="tm" x="1285" y="282" text-anchor="middle">Story × N</text>
  <text class="ts" x="1285" y="304" text-anchor="middle">逐 Story 冻结 · 步骤对齐</text>
  <text class="ts" x="1285" y="324" text-anchor="middle">全部冻结才评审</text>
  <text class="ht" x="1285" y="368" text-anchor="middle">◎ 冻结即入队 · 可闲时消费</text>
  <rect class="n-pill" x="1241" y="380" width="88" height="18" rx="9"/>
  <text class="tc" x="1249" y="393">po-req-story</text>

  <!-- 体验评审（qa） -->
  <rect class="n-card lift" x="700" y="520" width="200" height="90" rx="12"/>
  <text class="tm" x="800" y="550" text-anchor="middle">体验评审（UI）</text>
  <text class="ht" x="800" y="572" text-anchor="middle">◎ AI 评审 + 自动修复 · 可冻结</text>
  <text class="ts" x="800" y="592" text-anchor="middle">设计决策留到 ★E2 确认</text>
  <rect class="n-pill" x="744" y="616" width="112" height="18" rx="9"/>
  <text class="tc" x="752" y="629">qa-req-ux-review</text>

  <!-- 规格评审（闸门） -->
  <rect class="n-gate lift" x="1240" y="505" width="220" height="120" rx="6"/>
  <rect x="1246" y="511" width="208" height="108" fill="none" stroke="var(--ink)" stroke-width="0.8"/>
  <text class="tm" x="1350" y="540" text-anchor="middle">规格评审 · 循环出口</text>
  <text class="ts" x="1350" y="562" text-anchor="middle">AI 五维 · 对抗审查（异构模型）</text>
  <text class="ts" x="1350" y="580" text-anchor="middle">走查稿 ↔ Story ↔ 原型</text>
  <text class="ts" x="1350" y="600" text-anchor="middle">无 open 阻断项才放行</text>
  <rect class="n-pill" x="1420" y="631" width="124" height="18" rx="9"/>
  <text class="tc" x="1428" y="644">qa-req-spec-review</text>

  <!-- 两个人工决策点 -->
  <polygon class="n-decision lift" points="620,126 705,158 620,190 535,158"/>
  <text class="gd" x="620" y="154" text-anchor="middle">★ E1 探索确认</text>
  <text class="ts" x="620" y="172" text-anchor="middle">业务逐条裁决</text>

  <polygon class="n-decision lift" points="1420,126 1510,158 1420,190 1330,158"/>
  <text class="gd" x="1420" y="154" text-anchor="middle">★ E2 规格·原型确认</text>
  <text class="ts" x="1420" y="172" text-anchor="middle">确认后冻结</text>

  <!-- 出口 -->
  <a href="delivery.html">
    <ellipse class="n-end lift" cx="1510" cy="300" rx="70" ry="32"/>
    <text class="tm" x="1510" y="296" text-anchor="middle">③ 技术设计</text>
    <text class="ts" x="1510" y="314" text-anchor="middle">开发 · 测试</text>
  </a>

  <!-- 正向流转 -->
  <path class="edge" d="M290 300 H330"/>
  <path class="edge" d="M455 230 V158 H535"/>
  <path class="edge" d="M620 190 V300 H700"/>
  <path class="edge" d="M815 392 V460 H800 V520"/>
  <path class="edge" d="M900 565 H955 V300 H980"/>
  <path class="edge" d="M1150 300 H1200"/>
  <path class="edge" d="M1362 352 V505"/>
  <path class="edge" d="M1420 505 V190"/>
  <path class="edge" d="M1510 190 V268"/>

  <!-- 出口门禁：冻结放行 -->
  <rect class="n-gate" x="1502" y="219" width="16" height="16" rx="2"/>
  <rect x="1506" y="223" width="8" height="8" fill="none" stroke="var(--ink)" stroke-width="1"/>
  <text class="tc" x="1526" y="228">冻结放行</text>

  <!-- 打回（红虚线）：一律走 qa 泳道下方，按目标由近到远排成三条轨道；
       竖直段只走卡片之间的空隙，不穿卡片、不压标签 -->
  <!-- 体验评审 → 原型（体验问题回炉，走 探索/原型 之间的空缝） -->
  <path class="edge-red" d="M700 565 H664 V360 H700"/>
  <text class="rd" x="656" y="470" text-anchor="end">体验问题 → 原型回炉</text>
  <!-- 规格评审 → Story × N（回队列：从左侧空缝上行，进 Story 左边） -->
  <path class="edge-red" d="M1280 625 V648 H1178 V330 H1200"/>
  <!-- 规格评审 → 原型（回炉：走 原型 右下的列空隙上行，进底边） -->
  <path class="edge-red" d="M1310 625 V670 H915 V390"/>
  <!-- 规格评审 → 探索（C 业务变更，立即停） -->
  <path class="edge-red" d="M1340 625 V692 H455 V390"/>
  <text class="rd" x="470" y="714">G 覆盖缺口 / X 不一致 / T 追溯断链 → 按类回炉（最多 2 轮）</text>
  <text class="rd" x="470" y="736">C 业务变更 → 立即停 · 回探索 + 业务裁决</text>

  <!-- 底部铁律 -->
  <text class="t" x="140" y="766">循环边界：调研是入口，规格评审是唯一出口 —— 评审通过 + ★E2 确认 → 冻结 → 才允许进入技术设计与交接。</text>
  <text class="ts" x="140" y="786">为什么是 Epic 批：覆盖率、术语、权限矩阵、Story 与原型的一致性，只有把整批 Story 放在一起看才判得出来。</text>
</svg>
</div>
</body>
</html>
